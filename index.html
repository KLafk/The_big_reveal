<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>One Last Thing...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #140914;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 35px;
    }

    button {
      background: transparent;
      color: white;
      border: 1px solid white;
      border-radius: 40px;
      padding: 18px 40px;
      font-size: 1.1rem;
      letter-spacing: 3px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #status {
      margin-top: 25px;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>One Last Thing...</h1>

    <button id="playButton">▶ PLAY</button>

    <div id="status">Press play when you're ready.</div>

  </div>

  <audio id="music">
    <source src="Fever.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById("music");
    const button = document.getElementById("playButton");
    const status = document.getElementById("status");

    button.addEventListener("click", function() {

      if (music.paused) {
        music.play();

        button.textContent = "❚❚ PAUSE";
        status.textContent = "♪";

      } else {
        music.pause();

        button.textContent = "▶ PLAY";
        status.textContent = "Press play when you're ready.";
      }

    });
  </script>

</body>
</html>
